<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>V7影院旗舰版播放器 - Master Enterprise</title>
<style>
:root{--bg:#05070b;--panel:rgba(14,18,28,.72);--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#8c98aa;--accent:#00d9ff;--accent2:#367dff;--danger:#ff5d73}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{overflow:hidden;user-select:none}
button,input,select{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer}
.player{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;background:#000}
.video-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.ambient{position:absolute;inset:-18%;width:136%;height:136%;filter:blur(85px) opacity(.42);mix-blend-mode:screen;pointer-events:none;z-index:0}
video{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;background:#000}
.brightness{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
.scrim{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 25%,transparent 65%,rgba(0,0,0,.62))}
.topbar{position:absolute;left:18px;right:18px;top:18px;z-index:8;display:flex;gap:10px;align-items:center;pointer-events:none}
.badge,.top-btn,.status{pointer-events:auto;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:14px}
.badge{padding:9px 13px;font-size:11px;letter-spacing:1.4px;color:#b8c7d9}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-btn{width:40px;height:40px;font-size:16px}
.top-btn:hover,.control:hover,.select:hover{background:rgba(255,255,255,.11)}
.center-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;min-width:130px;padding:14px 18px;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(5,7,11,.7);backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:.2s}
.center-state.show{opacity:1}
.center-state .spin{width:20px;height:20px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hud{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) translateY(8px);z-index:20;padding:11px 18px;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,22,.75);backdrop-filter:blur(20px);color:#dffbff;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.hud.show{opacity:1;transform:translate(-50%,-50%) translateY(0)}
.playlist{position:absolute;right:18px;top:68px;bottom:18px;width:min(380px,calc(100vw - 36px));z-index:12;display:flex;flex-direction:column;background:rgba(12,16,25,.84);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 30px 80px rgba(0,0,0,.55);transform:translateX(calc(100% + 30px));transition:.35s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.playlist.open{transform:translateX(0)}
.list-head{padding:16px;border-bottom:1px solid var(--line)}
.list-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.list-title strong{font-size:15px}
.count{font-size:11px;color:var(--muted)}
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);color:#fff;outline:0}
.items{overflow:auto;padding:8px}
.item{padding:13px;border-radius:13px;color:#aeb8c7;font-size:13px;display:flex;gap:10px;align-items:center;transition:.18s}
.item:hover{background:rgba(255,255,255,.06);color:#fff}
.item.active{background:linear-gradient(90deg,rgba(54,125,255,.2),rgba(0,217,255,.05));color:#eafcff}
.item .dot{width:7px;height:7px;border-radius:50%;background:#4b5667;flex:none}
.item.active .dot{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{position:relative;z-index:10;padding:8px 18px calc(12px + env(safe-area-inset-bottom)) ;background:linear-gradient(to top,#05070b 82%,rgba(5,7,11,.86));border-top:1px solid rgba(255,255,255,.05)}
.progress-hit{padding:9px 0;cursor:pointer;touch-action:none}
.progress{height:4px;background:rgba(255,255,255,.14);border-radius:8px;position:relative}
.buffer{position:absolute;left:0;top:0;height:100%;width:0;background:rgba(255,255,255,.28);border-radius:8px}
.bar{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px}
.progress-hit:hover .progress{height:7px}
.main-row{display:flex;align-items:center;gap:7px;min-height:46px}
.control{height:38px;min-width:38px;padding:0 11px;border:1px solid transparent;border-radius:11px;background:rgba(255,255,255,.045);font-size:12px;transition:.18s}
.control.primary{background:linear-gradient(135deg,#287cff,#00cfe8)}
.control.active{background:rgba(0,217,255,.14);border-color:rgba(0,217,255,.35);color:#aef6ff}
.time{font-variant-numeric:tabular-nums;color:#c0cad7;font-size:12px;white-space:nowrap;margin:0 4px}
.spacer{flex:1}
.range{width:86px;accent-color:var(--accent)}
.select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.045);color:#fff;outline:0;font-size:12px}
.status{padding:7px 9px;color:var(--accent);font-size:9px;letter-spacing:.8px}
.settings{position:absolute;right:18px;bottom:78px;z-index:13;width:260px;padding:14px;background:rgba(12,16,25,.9);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(28px);display:none}
.settings.open{display:block}
.setting{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;color:#aeb8c7}
.setting:last-child{border-bottom:0}
.toggle{width:42px;height:24px;border-radius:20px;background:#29313e;position:relative}
.toggle:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on{background:var(--accent2)}
.toggle.on:after{transform:translateX(18px)}
.pwd-mask{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,4,8,.72);backdrop-filter:blur(34px)}
.pwd-mask.show{display:flex}
.pwd-box{width:min(390px,calc(100vw - 32px));padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(16,21,31,.8);box-shadow:0 35px 100px rgba(0,0,0,.65);text-align:center}
.pwd-box h2{font-size:19px;margin-bottom:8px}.pwd-box p{font-size:12px;color:var(--muted);margin-bottom:20px}
.pwd-input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.05);color:#fff;text-align:center;outline:0;letter-spacing:4px}
.pwd-input:focus{border-color:var(--accent)}
.unlock{width:100%;height:46px;margin-top:12px;border-radius:13px;background:linear-gradient(135deg,#287cff,#00d9ff);font-weight:700}
.error{height:18px;color:var(--danger);font-size:11px;margin-top:8px;opacity:0}.error.show{opacity:1}
.toast-error{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:25;max-width:90%;padding:12px 16px;border-radius:14px;background:rgba(80,10,22,.85);border:1px solid rgba(255,93,115,.3);color:#ffdce2;display:none}
.toast-error.show{display:block}
@media(max-width:760px){
 .topbar{left:10px;right:10px;top:10px}.playlist{right:10px;top:58px;bottom:10px}
 .controls{padding-left:10px;padding-right:10px}.main-row{gap:5px}
 .range{width:65px}.status{display:none}.hide-mobile{display:none}
 .control{min-width:36px;padding:0 8px}
 .settings{right:10px;bottom:74px}
}
@media(max-width:430px){.time{font-size:11px}.quality-label{display:none}.control{font-size:11px}.range{width:55px}}

.v7-menu{position:absolute;right:18px;bottom:78px;z-index:14;width:290px;padding:12px;background:rgba(12,16,25,.94);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(28px);display:none;box-shadow:0 25px 70px rgba(0,0,0,.5)}
.v7-menu.open{display:block}.menu-title{font-size:12px;color:#fff;padding:7px 8px 10px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.menu-btn{padding:11px 9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);font-size:11px;text-align:left}.menu-btn:hover{background:rgba(255,255,255,.1)}
.next-card{position:absolute;right:18px;bottom:90px;z-index:15;width:310px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,22,.9);backdrop-filter:blur(25px);display:none}.next-card.show{display:block}.next-card small{color:var(--muted)}.next-name{margin:6px 0 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-row{display:flex;gap:7px}.next-row button{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px}.next-row button:first-child{background:linear-gradient(135deg,#287cff,#00d9ff)}
.history-dot{width:7px;height:7px;border-radius:50%;background:#6b7788;flex:none}.item .star{margin-left:auto;color:#657083;font-size:14px}.item.fav .star{color:#ffd45c}.item{cursor:pointer}
.theater .controls{background:linear-gradient(to top,#000 82%,rgba(0,0,0,.86))}.theater video{object-fit:contain}
@media(max-width:760px){.v7-menu,.next-card{right:10px}.v7-menu{bottom:74px}.next-card{bottom:82px;width:min(310px,calc(100vw - 20px))}
}

.locked .controls,.locked .topbar{opacity:.12;transition:.25s;pointer-events:none}.locked .controls:hover,.locked .topbar:hover{opacity:1}.video-wrap.cursor-hide{cursor:none}.v7-lock{position:absolute;left:18px;top:68px;z-index:16;width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(22px)}.v7-lock.on{color:var(--accent)}.resume-card{position:absolute;left:18px;bottom:92px;z-index:16;width:min(330px,calc(100vw - 36px));padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,22,.92);backdrop-filter:blur(25px);display:none}.resume-card.show{display:block}.resume-card small{color:var(--muted)}.resume-name{margin:6px 0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resume-row{display:flex;gap:7px}.resume-row button{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px}.resume-row button:first-child{background:linear-gradient(135deg,#287cff,#00d9ff)}.mini-info{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:16;padding:8px 12px;border-radius:12px;background:rgba(5,7,11,.7);border:1px solid var(--line);font-size:11px;color:#d8e2ef;opacity:0;pointer-events:none;transition:.2s}.mini-info.show{opacity:1}@media(max-width:760px){.v7-lock{left:10px;top:58px}.resume-card{left:10px;bottom:82px}}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="video-wrap" id="videoWrap">
    <canvas class="ambient" id="ambient"></canvas>
    <div class="brightness" id="brightness"></div>
    <video id="video" playsinline preload="metadata"></video>
    <div class="scrim"></div>
    <div class="topbar">
      <div class="badge" id="titleBadge">MASTER V7</div>
      <div class="top-actions">
        <button class="top-btn" id="btnSettings" aria-label="设置">⚙</button>
        <button class="top-btn" id="btnListTop" aria-label="播放列表">☰</button><button class="top-btn" id="btnV7Menu" aria-label="影院工具">⋮</button>
      </div>
    </div>
    <button class="v7-lock" id="lockBtn" aria-label="锁定控制栏">🔒</button>
    <div class="resume-card" id="resumeCard"><small>继续观看</small><div class="resume-name" id="resumeName"></div><div class="resume-row"><button id="resumeNow">继续播放</button><button id="resumeStart">从头播放</button></div></div>
    <div class="mini-info" id="miniInfo"></div>
    <div class="mini-info" id="miniInfo"></div>
    <div class="center-state" id="loading"><div class="spin"></div><div id="loadingText">正在连接视频源</div></div>
    <div class="hud" id="hud"></div>
    <div class="toast-error" id="fault"></div>
    <div class="playlist" id="playlist">
      <div class="list-head">
        <div class="list-title"><strong>播放列表</strong><span class="count" id="count">0</span></div>
        <input class="search" id="search" placeholder="搜索影片…" autocomplete="off">
      </div>
      <div class="items" id="items"></div>
    </div>
    <div class="settings" id="settings">
      <div class="setting"><span>自动播放下一集</span><button class="toggle on" id="toggleAuto"></button></div>
      <div class="setting"><span>循环播放</span><button class="toggle" id="toggleLoop"></button></div>
      <div class="setting"><span>环境光</span><button class="toggle on" id="toggleAmbient"></button></div><div class="setting"><span>影院模式</span><button class="toggle" id="toggleTheater"></button></div>
    </div>
    <div class="v7-menu" id="v6Menu"><div class="menu-title">影院工具</div><div class="menu-grid"><button class="menu-btn" id="historyBtn">🕘 播放历史</button><button class="menu-btn" id="favoriteBtn">☆ 收藏本片</button><button class="menu-btn" id="aspectBtn">▣ 画面比例</button><button class="menu-btn" id="subtitleBtn">CC 字幕</button><button class="menu-btn" id="clearHistoryBtn">清空历史</button><button class="menu-btn" id="closeMenu">关闭菜单</button></div></div><div class="next-card" id="nextCard"><small>下一集 · <span id="nextCountdown">5</span> 秒后播放</small><div class="next-name" id="nextName"></div><div class="next-row"><button id="nextNow">立即播放</button><button id="nextCancel">取消</button></div></div>
    <div class="pwd-mask" id="pwdMask">
      <div class="pwd-box">
        <h2>VIP 身份验证</h2><p>请输入观看密码后继续播放</p>
        <input class="pwd-input" id="pwdInput" type="password" autocomplete="off" inputmode="text" placeholder="观看密码">
        <div class="error" id="error">密码错误，请重试</div>
        <button class="unlock" id="unlock">确认解锁</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="progress-hit" id="progressHit">
      <div class="progress"><div class="buffer" id="buffer"></div><div class="bar" id="bar"></div></div>
    </div>
    <div class="main-row">
      <button class="control primary" id="play">播放</button>
      <button class="control hide-mobile" id="back">−10</button>
      <button class="control hide-mobile" id="forward">+10</button>
      <span class="time" id="time">00:00 / 00:00</span>
      <div class="spacer"></div>
      <button class="control" id="mute">音量</button>
      <input class="range" id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="音量">
      <select class="select quality" id="quality" aria-label="清晰度"><option value="-1">自动</option></select>
      <select class="select" id="rate" aria-label="倍速">
        <option value=".5">0.5x</option><option value=".75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option>
      </select>
      <button class="control" id="pip">画中画</button>
      <button class="control" id="full">全屏</button><button class="control hide-mobile" id="menuBtn">更多</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
class MasterPlayerV7{
 constructor(){
  this.apis=['https://raw.githubusercontent.com/caoyuanlin1990/mp4-player/main/playlist.json',
            'https://cdn.jsdelivr.net/gh/caoyuanlin1990/mp4-player@main/playlist.json'];
  this.password="yu19941217";
  this.playlist=[];this.currentUrl="";this.pendingUrl="";this.hls=null;this.retry=0;this.maxRetry=6;this.retryTimer=null;this.lastStableAt=0;
  this.autoNext=localStorage.getItem("v7-auto-next")!=="0";this.loop=localStorage.getItem("v7-loop")==="1";this.ambientOn=localStorage.getItem("v7-ambient")!=="0";this.theater=localStorage.getItem("v7-theater")==="1";this.favorites=JSON.parse(localStorage.getItem("v7-favorites")||"[]");this.history=JSON.parse(localStorage.getItem("v7-history")||"[]");this.nextTimer=null;this.locked=localStorage.getItem("v7-locked")==="1";this.resumePending=null;this.lastTap=0;
  this.$={};this.bind();this.loadPlaylist();
 }
 bind(){
  const ids=["video","videoWrap","ambient","brightness","playlist","items","count","search","settings","loading","loadingText","hud","fault","pwdMask","pwdInput","unlock","error","play","back","forward","time","buffer","bar","progressHit","mute","volume","quality","rate","pip","full","btnSettings","btnListTop","toggleAuto","toggleLoop","toggleAmbient","toggleTheater","titleBadge","v6Menu","historyBtn","favoriteBtn","aspectBtn","subtitleBtn","clearHistoryBtn","closeMenu","nextCard","nextCountdown","nextName","nextNow","nextCancel","btnV7Menu","menuBtn","lockBtn","resumeCard","resumeName","resumeNow","resumeStart","miniInfo"];
  ids.forEach(id=>this.$[id]=document.getElementById(id));
  this.$volume=localStorage.getItem("v7-volume")??localStorage.getItem("v4-volume")??"1";this.$.volume.value=this.$volume;this.$.video.volume=+this.$volume;
  this.$.rate.value=localStorage.getItem("v7-rate")??localStorage.getItem("v4-rate")??"1";this.$.video.playbackRate=+this.$.rate.value;
  this.$.toggleAuto.classList.toggle("on",this.autoNext);this.$.toggleLoop.classList.toggle("on",this.loop);this.$.toggleAmbient.classList.toggle("on",this.ambientOn);this.$.toggleTheater.classList.toggle("on",this.theater);this.applyTheater();this.applyLock();
  this.$.play.onclick=()=>this.togglePlay();this.$.back.onclick=()=>this.seek(-10);this.$.forward.onclick=()=>this.seek(10);
  this.$.mute.onclick=()=>this.toggleMute();this.$.volume.oninput=e=>this.setVolume(+e.target.value);
  this.$.rate.onchange=e=>{this.$.video.playbackRate=+e.target.value;localStorage.setItem("v7-rate",e.target.value);this.toast("倍速 "+e.target.value+"x")};
  this.$.quality.onchange=e=>this.setQuality(+e.target.value);
  this.$.pip.onclick=()=>this.pip();this.$.full.onclick=()=>this.fullscreen();
  this.$.btnSettings.onclick=()=>this.$.settings.classList.toggle("open");this.$.btnListTop.onclick=()=>this.$.playlist.classList.toggle("open");this.$.btnV7Menu.onclick=()=>this.$.v6Menu.classList.toggle("open");this.$.menuBtn.onclick=()=>this.$.v6Menu.classList.toggle("open");this.$.closeMenu.onclick=()=>this.$.v6Menu.classList.remove("open");this.$.historyBtn.onclick=()=>this.showHistory();this.$.favoriteBtn.onclick=()=>this.toggleFavorite();this.$.aspectBtn.onclick=()=>this.toggleAspect();this.$.subtitleBtn.onclick=()=>this.toggleSubtitle();this.$.clearHistoryBtn.onclick=()=>{this.history=[];localStorage.removeItem("v7-history");this.toast("播放历史已清空")};this.$.toggleTheater.onclick=()=>this.setToggle("theater");this.$.nextNow.onclick=()=>this.playNextNow();this.$.nextCancel.onclick=()=>this.cancelNext();
  this.$.lockBtn.onclick=()=>this.toggleLock();this.$.resumeNow.onclick=()=>this.resumeNow();this.$.resumeStart.onclick=()=>this.resumeStart();this.$.toggleAuto.onclick=()=>this.setToggle("auto");this.$.toggleLoop.onclick=()=>this.setToggle("loop");this.$.toggleAmbient.onclick=()=>this.setToggle("ambient");
  this.$.search.oninput=()=>this.renderList(this.$.search.value.trim().toLowerCase());
  this.$.video.addEventListener("timeupdate",()=>this.updateProgress());this.$.video.addEventListener("progress",()=>this.updateBuffer());
  this.$.video.addEventListener("play",()=>{this.$.play.textContent="暂停";this.$.loading.classList.remove("show");this.startAmbient()});
  this.$.video.addEventListener("pause",()=>{this.$.play.textContent="播放";this.stopAmbient()});
  this.$.video.addEventListener("waiting",()=>this.loading(true,"缓冲中…"));this.$.video.addEventListener("playing",()=>this.loading(false));
  this.$.video.addEventListener("ended",()=>this.next());
   this.$.video.addEventListener("canplay",()=>{this.lastStableAt=Date.now();});
   this.$.video.addEventListener("seeking",()=>this.toast("定位中…"));
   this.$.video.addEventListener("ratechange",()=>{this.$.rate.value=String(this.$.video.playbackRate);localStorage.setItem("v7-rate",String(this.$.video.playbackRate))});
  this.$.video.addEventListener("error",()=>this.fault("视频加载失败，请检查视频源或网络连接"));
  this.$.progressHit.addEventListener("pointerdown",e=>{this.scrub(e);this.$.progressHit.setPointerCapture?.(e.pointerId)});
  this.$.progressHit.addEventListener("pointermove",e=>{if(e.buttons)this.scrub(e)});
  document.addEventListener("keydown",e=>this.keys(e));
   let tap=0;this.$.videoWrap.addEventListener("pointerup",e=>{if(e.target.closest("button,.playlist,.settings,.pwd-mask,.controls"))return;const now=Date.now();if(now-tap<280)this.togglePlay();tap=now;});
  window.addEventListener("online",()=>{this.toast("网络已恢复");if(this.currentUrl)this.loadSource(this.currentUrl,true)});
   window.addEventListener("offline",()=>this.fault("网络已断开"));
   document.addEventListener("fullscreenchange",()=>this.toast(document.fullscreenElement?"已进入全屏":"已退出全屏"));
  document.addEventListener("visibilitychange",()=>{if(document.hidden)this.saveProgress()});
 }
 async loadPlaylist(){
  for(const api of this.apis){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),6500);const r=await fetch(api,{cache:"no-store",signal:c.signal});clearTimeout(t);if(!r.ok)throw Error();const d=await r.json();if(Array.isArray(d)&&d.length){this.playlist=d.filter(x=>x&&x.url);localStorage.setItem("v7-playlist-cache",JSON.stringify(this.playlist));this.renderList();if(this.playlist[0])this.intercept(this.playlist[0].url);return}}catch(e){}}
  try{const d=JSON.parse(localStorage.getItem("v7-playlist-cache")||"[]");if(d.length){this.playlist=d;this.renderList();this.intercept(d[0].url);return}}catch(e){}
  this.fault("播放列表加载失败");
 }
 renderList(q=""){
  this.$.items.innerHTML="";let list=this.playlist.filter(x=>(x.name||x.title||"未命名").toLowerCase().includes(q));this.$.count.textContent=this.playlist.length;
  list.forEach(x=>{const d=document.createElement("div");d.className="item"+(x.url===this.currentUrl?" active":"");d.innerHTML='<span class="dot"></span><span class="name"></span><span class="star"></span>';d.querySelector(".name").textContent=x.name||x.title||"未命名";const star=d.querySelector(".star");star.textContent=this.favorites.includes(x.url)?"★":"☆";d.classList.toggle("fav",this.favorites.includes(x.url));d.onclick=()=>{this.$.playlist.classList.remove("open");this.intercept(x.url)};this.$.items.appendChild(d)});
 }
 intercept(url){if(!url)return;if(sessionStorage.getItem("v7-verified")==="1")this.loadSource(url);else{this.pendingUrl=url;this.$.pwdMask.classList.add("show");setTimeout(()=>this.$.pwdInput.focus(),80)}}
 verify(){if(this.$.pwdInput.value===this.password){sessionStorage.setItem("v7-verified","1");this.$.pwdMask.classList.remove("show");this.$.error.classList.remove("show");const u=this.pendingUrl;this.pendingUrl="";if(u)this.loadSource(u)}else{this.$.error.classList.add("show");this.$.pwdInput.select()}}
 async loadSource(url,silent=false){
  if(!url)return;this.destroy();this.currentUrl=url;this.retry=0;this.addHistory(url);this.renderList(this.$.search.value.trim().toLowerCase());this.loading(!silent,"正在连接视频源");this.$.fault.classList.remove("show");
  if(!url.toLowerCase().includes(".m3u8")){this.$.video.src=url;this.$.video.onloadedmetadata=()=>this.ready(url);this.$.video.load();return}
  if(Hls.isSupported()){this.hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:45,maxBufferLength:60,maxMaxBufferLength:120,startLevel:-1,capLevelToPlayerSize:true,abrEwmaDefaultEstimate:3000000,abrBandWidthFactor:0.85,abrBandWidthUpFactor:0.7});this.hls.attachMedia(this.$.video);this.hls.loadSource(url);
   this.hls.on(Hls.Events.MANIFEST_PARSED,()=>{this.populateQuality();this.restoreQuality();this.ready(url)});this.hls.on(Hls.Events.LEVEL_SWITCHED,()=>this.toast("清晰度已切换"));
   this.hls.on(Hls.Events.ERROR,(ev,d)=>{if(!d.fatal)return;if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&this.retry<this.maxRetry){this.retry++;this.toast("网络重试 "+this.retry+"/"+this.maxRetry);clearTimeout(this.retryTimer);this.retryTimer=setTimeout(()=>this.hls&&this.hls.startLoad(-1),Math.min(8000,this.retry*900))}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&this.retry<2){this.retry++;this.hls.recoverMediaError()}else{this.fault("HLS 播放失败，请更换线路或稍后重试");this.loading(false)}});
  }else if(this.$.video.canPlayType("application/vnd.apple.mpegurl")){this.$.video.src=url;this.$.video.onloadedmetadata=()=>this.ready(url);this.$.video.load()}
  else this.fault("当前浏览器不支持 HLS");
 }
 ready(url){this.loading(false);this.$.video.controls=false;this.$.video.playbackRate=+(localStorage.getItem("v7-rate")||localStorage.getItem("v4-rate")||"1");this.$.titleBadge.textContent=(this.playlist.find(x=>x.url===url)?.name||"MASTER V7");const t=+(localStorage.getItem("v7-progress:"+url)||0);if(t>3&&isFinite(this.$.video.duration)&&t<this.$.video.duration-5){this.resumePending=t;this.$.resumeName.textContent=(this.playlist.find(x=>x.url===url)?.name||"当前视频")+" · 已观看 "+this.fmt(t);this.$.resumeCard.classList.add("show");this.$.video.pause();}else{this.resumePending=null;this.$.resumeCard.classList.remove("show");this.startPlayback();}}
 populateQuality(){if(!this.hls)return;const q=this.$.quality;q.innerHTML='<option value="-1">自动</option>';const seen=new Set();this.hls.levels.map((l,i)=>({l,i})).sort((a,b)=>(b.l.height||0)-(a.l.height||0)).forEach(({l,i})=>{const label=l.height?(l.height+"P"):(Math.round((l.bitrate||0)/1000)+"K");if(seen.has(label))return;seen.add(label);const o=document.createElement("option");o.value=i;o.textContent=label;q.appendChild(o)});q.value="-1"}
 setQuality(i){if(!this.hls)return;this.hls.currentLevel=i;localStorage.setItem("v5-quality",String(i));this.toast(i<0?"清晰度：自动":("清晰度："+(this.hls.levels[i]?.height?this.hls.levels[i].height+"P":"已切换")))}
  restoreQuality(){const q=+(localStorage.getItem("v5-quality")||-1);if(this.hls&&q>=0&&q<this.hls.levels.length){this.hls.currentLevel=q;this.$.quality.value=String(q)}}
 restore(url){const t=+(localStorage.getItem("v7-progress:"+url)||0);if(t>3&&isFinite(this.$.video.duration)&&t<this.$.video.duration-5)this.$.video.currentTime=t}
 saveProgress(){if(this.currentUrl&&this.$.video.currentTime>0)localStorage.setItem("v7-progress:"+this.currentUrl,String(this.$.video.currentTime))}
 updateProgress(){const v=this.$.video,d=v.duration;if(!isFinite(d)||d<=0)return;this.$.bar.style.width=(v.currentTime/d*100)+"%";this.$.time.textContent=this.fmt(v.currentTime)+" / "+this.fmt(d);this.saveProgress()}
 updateBuffer(){try{const v=this.$.video,d=v.duration;if(v.buffered.length&&isFinite(d))this.$.buffer.style.width=(v.buffered.end(v.buffered.length-1)/d*100)+"%"}catch(e){}}
 scrub(e){const r=this.$.progressHit.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(isFinite(this.$.video.duration))this.$.video.currentTime=p*this.$.video.duration}
 togglePlay(){if(this.$.video.paused){if(sessionStorage.getItem("v7-verified")!=="1"){this.intercept(this.currentUrl||this.playlist[0]?.url);return}this.$.video.play().catch(()=>{})}else this.$.video.pause()}
 seek(sec){if(!isFinite(this.$.video.duration))return;this.$.video.currentTime=Math.max(0,Math.min(this.$.video.duration,this.$.video.currentTime+sec));this.toast((sec>0?"+":"")+sec+" 秒")}
 toggleMute(){this.$.video.muted=!this.$.video.muted;this.$.mute.textContent=this.$.video.muted?"静音":"音量";this.toast(this.$.video.muted?"已静音":"已恢复声音")}
 setVolume(v){this.$.video.volume=v;this.$.video.muted=v===0;localStorage.setItem("v7-volume",v);this.$.mute.textContent=v===0?"静音":"音量"}
 next(){this.saveProgress();if(this.loop){this.$.video.currentTime=0;this.$.video.play();return}if(!this.autoNext)return;const i=this.playlist.findIndex(x=>x.url===this.currentUrl);if(i>=0&&i<this.playlist.length-1)this.showNextCard(this.playlist[i+1]);else this.toast("已播放到列表末尾")}
 showNextCard(item){clearInterval(this.nextTimer);this.nextItem=item;this.$.nextName.textContent=item.name||item.title||"下一集";this.$.nextCard.classList.add("show");let n=5;this.$.nextCountdown.textContent=n;this.nextTimer=setInterval(()=>{n--;this.$.nextCountdown.textContent=n;if(n<=0)this.playNextNow()},1000)}
 playNextNow(){clearInterval(this.nextTimer);this.$.nextCard.classList.remove("show");if(this.nextItem)this.intercept(this.nextItem.url)}
 cancelNext(){clearInterval(this.nextTimer);this.nextItem=null;this.$.nextCard.classList.remove("show");this.toast("已取消自动播放")}
 addHistory(url){const item=this.playlist.find(x=>x.url===url);if(!item)return;this.history=[{url,name:item.name||item.title||"未命名",time:Date.now()},...this.history.filter(x=>x.url!==url)].slice(0,30);localStorage.setItem("v7-history",JSON.stringify(this.history))}
 showHistory(){this.$.v6Menu.classList.remove("open");if(!this.history.length){this.toast("暂无播放历史");return}this.$.items.innerHTML="";this.$.count.textContent=this.history.length;this.history.forEach(x=>{const d=document.createElement("div");d.className="item"+(x.url===this.currentUrl?" active":"");d.innerHTML='<span class="history-dot"></span><span class="name"></span>';d.querySelector('.name').textContent=x.name;d.onclick=()=>this.intercept(x.url);this.$.items.appendChild(d)});this.$.playlist.classList.add("open");this.toast("已显示最近观看")}
 toggleFavorite(){const u=this.currentUrl;if(!u)return;const i=this.favorites.indexOf(u);if(i>=0){this.favorites.splice(i,1);this.toast("已取消收藏")}else{this.favorites.unshift(u);this.toast("已收藏本片")}localStorage.setItem("v7-favorites",JSON.stringify(this.favorites));this.renderList(this.$.search.value.trim().toLowerCase())}
 toggleAspect(){const v=this.$.video;v.style.objectFit=v.style.objectFit==="cover"?"contain":"cover";this.toast(v.style.objectFit==="cover"?"画面：铺满":"画面：原比例")}
 toggleSubtitle(){if(this.$.video.textTracks&&this.$.video.textTracks.length){const t=this.$.video.textTracks[0];const on=t.mode==="showing";t.mode=on?"hidden":"showing";this.toast(on?"字幕已关闭":"字幕已开启")}else this.toast("当前视频没有内置字幕")}
 startPlayback(){this.$.resumeCard.classList.remove("show");this.$.video.play().catch(()=>{this.$.video.muted=true;this.$.video.play().catch(()=>{});this.toast("浏览器阻止有声自动播放，已静音启动")})}
 resumeNow(){if(this.resumePending!=null){this.$.video.currentTime=this.resumePending;this.resumePending=null;}this.startPlayback()}
 resumeStart(){this.resumePending=null;this.$.video.currentTime=0;localStorage.removeItem("v7-progress:"+this.currentUrl);this.startPlayback()}
 toggleLock(){this.locked=!this.locked;localStorage.setItem("v7-locked",this.locked?"1":"0");this.applyLock();this.toast(this.locked?"控制栏已锁定":"控制栏已解锁")}
 applyLock(){document.getElementById("player").classList.toggle("locked",this.locked);if(this.$.lockBtn){this.$.lockBtn.classList.toggle("on",this.locked);this.$.lockBtn.textContent=this.locked?"🔓":"🔒"}}
 showInfo(text){if(!this.$.miniInfo)return;this.$.miniInfo.textContent=text;this.$.miniInfo.classList.add("show");clearTimeout(this._infoTimer);this._infoTimer=setTimeout(()=>this.$.miniInfo.classList.remove("show"),900)}
 applyTheater(){document.body.classList.toggle("theater",this.theater)}
 setToggle(which){if(which==="auto"){this.autoNext=!this.autoNext;localStorage.setItem("v7-auto-next",this.autoNext?"1":"0");this.$.toggleAuto.classList.toggle("on",this.autoNext)}
  if(which==="loop"){this.loop=!this.loop;localStorage.setItem("v7-loop",this.loop?"1":"0");this.$.toggleLoop.classList.toggle("on",this.loop)}
  if(which==="ambient"){this.ambientOn=!this.ambientOn;localStorage.setItem("v7-ambient",this.ambientOn?"1":"0");this.$.toggleAmbient.classList.toggle("on",this.ambientOn);if(!this.ambientOn)this.$.ambient.style.display="none";else this.$.ambient.style.display="block"}
  if(which==="theater"){this.theater=!this.theater;localStorage.setItem("v7-theater",this.theater?"1":"0");this.$.toggleTheater.classList.toggle("on",this.theater);this.applyTheater();this.toast(this.theater?"影院模式已开启":"影院模式已关闭")}
 }
 async pip(){try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(document.pictureInPictureEnabled)await this.$.video.requestPictureInPicture();else this.toast("当前浏览器不支持画中画")}catch(e){this.toast("画中画不可用")}}
 async fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await this.$.videoWrap.requestFullscreen?.()}catch(e){this.toast("全屏不可用")}}
 keys(e){if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(k===" "){e.preventDefault();this.togglePlay()}else if(k==="m")this.toggleMute();else if(k==="f")this.fullscreen();else if(k==="p")this.pip();else if(k==="l")this.toggleLock();else if(k==="arrowleft")this.seek(-10);else if(k==="arrowright")this.seek(10);else if(k==="arrowup"){this.setVolume(Math.min(1,this.$.video.volume+.05));this.showInfo("音量 "+Math.round(this.$.video.volume*100)+"%")}else if(k==="arrowdown"){this.setVolume(Math.max(0,this.$.video.volume-.05));this.showInfo("音量 "+Math.round(this.$.video.volume*100)+"%")}else if(k===","||k==="<"){this.$.video.playbackRate=Math.max(.5,this.$.video.playbackRate-.25);this.$.rate.value=String(this.$.video.playbackRate);this.showInfo("倍速 "+this.$.video.playbackRate+"x")}else if(k==="."||k===">"){this.$.video.playbackRate=Math.min(3,this.$.video.playbackRate+.25);this.$.rate.value=String(this.$.video.playbackRate);this.showInfo("倍速 "+this.$.video.playbackRate+"x")}else if(/^[0-9]$/.test(k)){const n=Number(k);if(isFinite(this.$.video.duration))this.$.video.currentTime=this.$.video.duration*(n/10);this.showInfo(n*10+"%")}else if(k==="escape"){this.$.v6Menu.classList.remove("open");this.$.settings.classList.remove("open");this.cancelNext();this.$.resumeCard.classList.remove("show")}}
 loading(on,text){this.$.loadingText.textContent=text||"加载中";this.$.loading.classList.toggle("show",on)}
 fault(text){this.loading(false);this.$.fault.textContent=text;this.$.fault.classList.add("show");setTimeout(()=>this.$.fault.classList.remove("show"),5000)}
 toast(text){this.$.hud.textContent=text;this.$.hud.classList.add("show");clearTimeout(this._toast);this._toast=setTimeout(()=>this.$.hud.classList.remove("show"),1300)}
 fmt(t){t=Math.max(0,Math.floor(t||0));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
 startAmbient(){if(!this.ambientOn)return;cancelAnimationFrame(this.af);const c=this.$.ambient,x=c.getContext("2d");c.width=48;c.height=27;const draw=()=>{if(!this.ambientOn||this.$.video.paused)return;try{x.drawImage(this.$.video,0,0,48,27)}catch(e){}this.af=requestAnimationFrame(draw)};draw()}
 stopAmbient(){cancelAnimationFrame(this.af)}
 destroy(){this.stopAmbient();clearTimeout(this.retryTimer);clearInterval(this.nextTimer);this.$.nextCard.classList.remove("show");this.$.resumeCard?.classList.remove("show");this.resumePending=null;this.retryTimer=null;if(this.hls){try{this.hls.destroy()}catch(e){}this.hls=null}this.$.video.removeAttribute("src");this.$.video.load()}
}
document.addEventListener("DOMContentLoaded",()=>{window.MasterPlayer=new MasterPlayerV7();document.getElementById("unlock").onclick=()=>window.MasterPlayer.verify();document.getElementById("pwdInput").onkeydown=e=>{if(e.key==="Enter")window.MasterPlayer.verify()}})
</script>
